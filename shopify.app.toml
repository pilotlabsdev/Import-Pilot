client_id = "0266903e6bdd1744c8cea256d89ff230"
name = "import-pilot"
handle = "import-pilot"
application_url = "https://import-pilot-production.up.railway.app"
embedded = true
extension_directories = []

[access_scopes]
scopes = "write_products,read_products,read_inventory,write_inventory,read_locations,write_product_listings,read_product_listings,read_channels,write_channels,read_metaobject_definitions,write_metaobject_definitions,read_metaobjects,write_metaobjects,write_files"

[auth]
redirect_urls = [
  "https://localhost:3000/auth/callback",
  "https://localhost:5173/auth/callback",
  "https://import-pilot-production.up.railway.app/auth/callback",
]

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["products/update", "products/delete", "inventory_items/update", "app/uninstalled"]
uri = "/webhooks"

[[webhooks.subscriptions]]
compliance_topics = ["customers/redact", "customers/data_request", "shop/redact"]
uri = "/webhooks"

[build]
automatically_update_urls_on_dev = true